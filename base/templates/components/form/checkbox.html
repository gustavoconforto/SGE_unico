<fieldset class="fieldset">
    <span class="flex justify-left items-center gap-3">
        <label for="{{ field.id_for_label }}" class="label text-lg">
        {{ field.label }}
        </label>
        {{ field }}
    </span>
    {% if field.help_text %}
    <p class="label">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
    <div class="mt-1 text-sm text-red-600 space-y-1 mt-2">
        {% for error in field.errors %}
        <p>{{ error }}</p>
        {% endfor %}
    </div>
    {% endif %}
</fieldset>
