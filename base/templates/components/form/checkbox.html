<div class="ui-field">
    <span class="flex items-center gap-3">
        {{ field }}
        <label for="{{ field.id_for_label }}" class="ui-label cursor-pointer">{{ field.label }}</label>
    </span>
    {% if field.help_text %}
    <p class="ui-help">{{ field.help_text }}</p>
    {% endif %}
    {% for error in field.errors %}
    <p class="ui-error"><span class="material-symbols-outlined text-[16px]">error</span>{{ error }}</p>
    {% endfor %}
</div>
