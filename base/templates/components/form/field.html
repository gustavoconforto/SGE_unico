<div class="ui-field">
    <label for="{{ field.id_for_label }}" class="ui-label">
        {{ field.label }}{% if not field.field.required %} <span class="ui-optional">(opcional)</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
    <p class="ui-help">{{ field.help_text }}</p>
    {% endif %}
    {% for error in field.errors %}
    <p class="ui-error"><span class="material-symbols-outlined text-[16px]">error</span>{{ error }}</p>
    {% endfor %}
</div>
