<fieldset class="ui-field">
    <legend class="ui-label mb-1.5">
        {{ field.label }}{% if not field.field.required and field.form.instance %} <span class="ui-optional">(opcional)</span>{% endif %}
    </legend>
    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">
        {% for choice in field %}
        <label for="{{ choice.id_for_label }}" class="flex cursor-pointer items-center gap-2 text-sm text-slate-700">
            {{ choice.tag }}
            {{ choice.choice_label }}
        </label>
        {% empty %}
        <p class="ui-help">Nenhuma opção cadastrada</p>
        {% endfor %}
    </div>
    {% if field.help_text %}
    <p class="ui-help">{{ field.help_text }}</p>
    {% endif %}
    {% for error in field.errors %}
    <p class="ui-error"><span class="material-symbols-outlined text-[16px]">error</span>{{ error }}</p>
    {% endfor %}
</fieldset>
