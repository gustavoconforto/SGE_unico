<input type="search"
       name="q"
       value="{{ q }}"
       placeholder="{{ placeholder|default:'Pesquisar...' }}"
       autocomplete="off"
       hx-get="{{ request.path }}"
       hx-trigger="input changed delay:500ms, keyup[key=='Enter'], search"
       hx-target="#search-results"
       hx-push-url="true"
       class="mb-4 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
