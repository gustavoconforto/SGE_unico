{% load ui %}
<form hx-get="{{ request.path }}"
      hx-trigger="input delay:500ms, submit"
      hx-target="#search-results"
      hx-push-url="true"
      class="mb-4"
      data-filter-form>
  <div class="flex flex-wrap items-center gap-3">
    <div class="relative max-w-xl min-w-64 flex-1">
      <span class="material-symbols-outlined pointer-events-none absolute top-1/2 left-3 z-10 -translate-y-1/2 text-slate-400">search</span>
      <input type="search"
             name="q"
             value="{{ q }}"
             placeholder="{{ placeholder|default:'Pesquisar...' }}"
             aria-label="{{ placeholder|default:'Pesquisar' }}"
             autocomplete="off"
             class="input w-full pl-10">
    </div>
    {% if filter_form %}
    {% with active=filter_form|active_filter_count %}
    <button type="button" class="ui-btn ui-btn-secondary" aria-controls="filter-panel"
            aria-expanded="{% if active %}true{% else %}false{% endif %}" data-filter-toggle>
      <span class="material-symbols-outlined text-slate-500">tune</span>Filtros
      <span class="min-w-5 rounded-full bg-slate-800 px-1.5 text-xs font-semibold text-white{% if not active %} hidden{% endif %}" data-filter-count>{{ active }}</span>
    </button>
    {% endwith %}
    {% endif %}
  </div>
  {% if filter_form %}
  <div id="filter-panel" class="mt-3 rounded-xl border border-slate-200 bg-white p-4{% if not filter_form|active_filter_count %} hidden{% endif %}">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
      {% for field in filter_form %}
      <div class="flex flex-col gap-1">
        <label for="{{ field.id_for_label }}" class="text-xs font-semibold text-slate-600">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-xs text-red-700">{{ error }}</p>{% endfor %}
      </div>
      {% endfor %}
    </div>
    <div class="mt-3 flex justify-end">
      <a href="{{ request.path }}" class="text-sm text-slate-600 underline underline-offset-3 hover:text-slate-900">Limpar filtros</a>
    </div>
  </div>
  <script>
    (function () {
      const form = document.currentScript.closest('[data-filter-form]');
      const toggle = form.querySelector('[data-filter-toggle]');
      const panel = form.querySelector('#filter-panel');
      const badge = form.querySelector('[data-filter-count]');
      toggle.addEventListener('click', () => {
        const open = panel.classList.toggle('hidden') === false;
        toggle.setAttribute('aria-expanded', open);
      });
      form.addEventListener('input', () => {
        const count = [...panel.querySelectorAll('input, select, textarea')]
          .filter(el => (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value !== '').length;
        badge.textContent = count;
        badge.classList.toggle('hidden', count === 0);
      });
    })();
  </script>
  {% endif %}
</form>
