<form hx-get="{{ request.path }}"
      hx-trigger="input delay:500ms, submit"
      hx-target="#search-results"
      hx-push-url="true"
      class="mb-4 space-y-3">
  <input type="search"
         name="q"
         value="{{ q }}"
         placeholder="{{ placeholder|default:'Pesquisar...' }}"
         autocomplete="off"
         class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
  {% if filter_form %}
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
    {% for field in filter_form %}
    <fieldset class="fieldset py-0">
      <label for="{{ field.id_for_label }}" class="label text-xs font-medium text-slate-600">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<p class="text-xs text-red-600">{{ error }}</p>{% endfor %}
    </fieldset>
    {% endfor %}
  </div>
  <div class="flex justify-end">
    <a href="{{ request.path }}" class="text-sm text-slate-500 hover:text-slate-800 hover:underline">Limpar filtros</a>
  </div>
  {% endif %}
</form>
