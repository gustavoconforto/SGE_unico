{% if page_obj.has_other_pages %}
  <nav class="mt-4 flex items-center justify-between text-sm text-slate-600">
    <div>
      {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}"
           hx-get="{{ request.path }}{% querystring page=page_obj.previous_page_number %}"
           hx-target="#search-results"
           hx-push-url="true"
           class="rounded-lg border border-slate-200 px-3 py-1.5 hover:bg-slate-50">Anterior</a>
      {% endif %}
    </div>
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    <div>
      {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}"
           hx-get="{{ request.path }}{% querystring page=page_obj.next_page_number %}"
           hx-target="#search-results"
           hx-push-url="true"
           class="rounded-lg border border-slate-200 px-3 py-1.5 hover:bg-slate-50">Próxima</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
