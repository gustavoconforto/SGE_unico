<script>
    (function () {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const desktop = window.matchMedia('(min-width: 1024px)');

        const toggle = document.getElementById('sidebar-toggle');

        // Off-canvas below lg: a closed drawer is inert so Tab can't reach its hidden links.
        function setMobileOpen(open) {
            sidebar.classList.toggle('-translate-x-full', !open);
            overlay.classList.toggle('hidden', !open);
            sidebar.inert = !open && !desktop.matches;
            toggle.setAttribute('aria-expanded', desktop.matches ? String(!sidebar.classList.contains('lg:hidden')) : String(open));
            if (open) sidebar.querySelector('[data-sidebar-close]').focus();
        }

        toggle.addEventListener('click', function () {
            if (desktop.matches) {
                sidebar.classList.toggle('lg:hidden');
                toggle.setAttribute('aria-expanded', String(!sidebar.classList.contains('lg:hidden')));
            } else {
                setMobileOpen(sidebar.classList.contains('-translate-x-full'));
            }
        });

        overlay.addEventListener('click', () => setMobileOpen(false));
        document.querySelectorAll('[data-sidebar-close]').forEach(el => el.addEventListener('click', () => setMobileOpen(false)));
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && !desktop.matches && !sidebar.inert) { setMobileOpen(false); toggle.focus(); }
        });
        desktop.addEventListener('change', () => setMobileOpen(false));
        setMobileOpen(false);

        // Open every section that holds the current page.
        sidebar.querySelectorAll('.nav-link.active').forEach(link => {
            for (let group = link.closest('details'); group; group = group.parentElement.closest('details')) {
                group.open = true;
            }
        });

        // Ctrl K / Cmd K jumps to the student search.
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                const search = document.getElementById('global-student-search');
                if (search) { e.preventDefault(); search.focus(); }
            }
        });
    })();
</script>
