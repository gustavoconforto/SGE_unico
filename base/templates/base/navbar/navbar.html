<header class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-200 bg-white px-4">
    <button type="button" id="sidebar-toggle" class="rounded-md p-1.5 text-gray-600 hover:bg-gray-100" aria-label="Alternar menu">
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <rect x="3.75" y="4.5" width="16.5" height="15" rx="2"/>
            <path stroke-linecap="round" d="M9.75 4.5v15"/>
        </svg>
    </button>
    <span class="h-5 w-px bg-gray-200"></span>
    <h1 class="truncate text-base font-semibold text-gray-900">{% block page_title %}Sistema de Gestão Escolar - 2027{% endblock %}</h1>
    <div class="ml-auto flex items-center gap-2">
        {% block navbar_actions %}{% endblock %}
    </div>
</header>
