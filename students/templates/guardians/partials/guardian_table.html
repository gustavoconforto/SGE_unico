  <div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>Nome</th>        
        <th class="text-right"><span class="sr-only">Ações</span></th>
      </tr>
    </thead>
    <tbody>
    {% for guardian in guardians %}
      <tr class="hover:bg-slate-50">
        <td>
            {{ guardian.name }}
        </td>
        <td class="text-right">
          <div class="flex flex-col gap-1 sm:flex-row sm:justify-end sm:gap-1.5">
            <a href={% url 'students:guardian_edit' guardian.pk %}>
              {% include 'components/button/button_select.html' with label="Editar"%}
            </a>
          </div>
        </td>
      </tr>
      {% empty %}
      {% include 'components/table/empty_table.html' with collspan=2%}
      {% endfor %}
    </tbody>
  </table>
  </div>
{% include 'components/table/pagination.html' %}
